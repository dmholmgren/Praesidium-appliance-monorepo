{% extends "billing/layout.html" %}
{% block billing_content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Clients</h1>
  <button onclick="document.getElementById('new-client').classList.remove('hidden')" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm">New Client</button>
</div>
<input type="text" placeholder="Search clients..." hx-get="/billing/clients-search" hx-trigger="keyup changed delay:300ms" hx-target="#client-list" name="search" class="block w-full rounded-md border-gray-300 shadow-sm text-sm mb-4">
<div id="client-list" class="space-y-3">
{% for client in clients %}
<a href="/billing/clients/{{ client.id }}" style="text-decoration:none; color:inherit; display:block;" class="bg-white rounded-lg shadow-sm border p-4 hover:shadow-md transition-shadow">
  <h3 class="font-medium text-gray-900">{{ client.client_name }}</h3>
  <p class="text-sm text-gray-500">{{ client.email or '' }}{% if client.phone %} | {{ client.phone }}{% endif %}</p>
</a>
{% endfor %}
</div>
{% endblock %}
