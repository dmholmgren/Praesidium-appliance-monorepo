{% extends "billing/layout.html" %}
{% block billing_content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Timesheet Review</h1>
  <div class="flex gap-3">
    <input type="date" id="date-from" value="{{ date_from }}" class="rounded-md border-gray-300 text-sm">
    <span class="text-gray-500 self-center">to</span>
    <input type="date" id="date-to" value="{{ date_to }}" class="rounded-md border-gray-300 text-sm">
  </div>
</div>
<div class="flex gap-3 bg-white p-3 rounded-lg border mb-4">
  <button onclick="bulkApprove()" class="px-3 py-1.5 bg-green-600 text-white text-sm rounded-md">Approve Selected</button>
  <span id="selected-count" class="text-sm text-gray-500 self-center">0 selected</span>
</div>
<div id="entries-list" class="space-y-3">
{% for entry in entries %}
{% include "partials/time_entry_card.html" %}
{% endfor %}
</div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg p-4 sm:hidden">
  <div class="flex justify-between text-sm">
    <span>Week: {{ week_hours }}h</span>
    <span class="text-green-600 font-medium">${{ week_amount }}</span>
  </div>
</div>
<script>
let touchStartX=0,activeCard=null;
document.addEventListener('touchstart',e=>{const c=e.target.closest('.te-card');if(c){touchStartX=e.touches[0].clientX;activeCard=c;}},{passive:true});
document.addEventListener('touchend',e=>{if(!activeCard)return;const diff=e.changedTouches[0].clientX-touchStartX;activeCard.style.transform='';activeCard.style.backgroundColor='';
if(diff>100){const id=activeCard.dataset.entryId;htmx.ajax('POST','/api/v1/billing/time-entries/bulk-approve',{target:'#entries-list',values:JSON.stringify([parseInt(id)])});}
activeCard=null;touchStartX=0;});
function bulkApprove(){const ids=[...document.querySelectorAll('.entry-cb:checked')].map(c=>parseInt(c.value));if(!ids.length)return;htmx.ajax('POST','/api/v1/billing/time-entries/bulk-approve',{target:'#entries-list',values:JSON.stringify(ids)});}
</script>
{% endblock %}
