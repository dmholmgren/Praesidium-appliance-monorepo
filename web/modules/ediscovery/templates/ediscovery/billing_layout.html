{% extends "base.html" %}
{% block title %}{{ brand.platform_name }} - Billing{% endblock %}
{% block content %}
<div class="min-h-screen bg-gray-50">
  <nav class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex space-x-8">
          <a href="/billing/clients" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 hover:text-gray-900">Clients</a>
          <a href="/billing/timesheet" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 hover:text-gray-900">Timesheet</a>
          <a href="/billing/trust" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 hover:text-gray-900">Trust</a>
          <a href="/billing/reports" class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 hover:text-gray-900">Reports</a>
        </div>
      </div>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">{% block billing_content %}{% endblock %}</main>
</div>
{% endblock %}
