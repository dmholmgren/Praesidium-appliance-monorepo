<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praesidium — Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center bg-gray-950">
  <div class="w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="text-blue-400 font-bold text-2xl tracking-wide">PRAESIDIUM</div>
      <div class="text-gray-500 text-sm mt-1">Platform Control</div>
    </div>

    <!-- Card -->
    <div class="bg-gray-900 border border-gray-800 rounded-lg p-8">
      <h2 class="text-white font-semibold text-base mb-6">Admin Sign In</h2>

      {% if error %}
      <div class="mb-4 px-3 py-2 bg-red-900 border border-red-700 rounded text-red-200 text-sm">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/admin/login" class="space-y-4">
        <div>
          <label class="block text-gray-400 text-xs mb-1.5 uppercase tracking-wide">Password</label>
          <input
            type="password"
            name="password"
            autofocus
            class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            placeholder="Platform admin password"
          >
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded text-sm transition-colors"
        >
          Sign In
        </button>
      </form>
    </div>

    <div class="text-center mt-6 text-gray-700 text-xs">
      Patent Pending — 64/020,027 — Dennis M. Holmgren, Reg. No. 54,168
    </div>
  </div>
</body>
</html>
