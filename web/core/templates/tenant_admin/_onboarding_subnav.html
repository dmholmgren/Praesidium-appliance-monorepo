{#
  Sub-navigation for Onboarding tab.
  Usage: {% include "tenant_admin/_onboarding_subnav.html" %}
#}
{% set p = request.url.path %}
<div style="display:flex; gap:0; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:0;">
  <a href="/tenant-admin/onboarding/billing"
     style="padding:6px 16px; font-size:12px; text-decoration:none; border-bottom:2px solid {% if p.startswith('/tenant-admin/onboarding/billing') or p == '/tenant-admin/onboarding' %}var(--primary){% else %}transparent{% endif %}; margin-bottom:-1px; color:{% if p.startswith('/tenant-admin/onboarding/billing') or p == '/tenant-admin/onboarding' %}var(--primary){% else %}var(--muted){% endif %}; font-weight:{% if p.startswith('/tenant-admin/onboarding/billing') or p == '/tenant-admin/onboarding' %}600{% else %}400{% endif %};">
    Time &amp; Billing Configuration
  </a>
  <a href="/tenant-admin/client-matter-cleanup"
     style="padding:6px 16px; font-size:12px; text-decoration:none; border-bottom:2px solid {% if p.startswith('/tenant-admin/client-matter-cleanup') or p.startswith('/tenant-admin/client-merge') %}var(--primary){% else %}transparent{% endif %}; margin-bottom:-1px; color:{% if p.startswith('/tenant-admin/client-matter-cleanup') or p.startswith('/tenant-admin/client-merge') %}var(--primary){% else %}var(--muted){% endif %}; font-weight:{% if p.startswith('/tenant-admin/client-matter-cleanup') or p.startswith('/tenant-admin/client-merge') %}600{% else %}400{% endif %};">
    Client &amp; Matter QC
  </a>
</div>
