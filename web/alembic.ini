# alembic.ini
# Praesidium Series 2.0
# Dialect changed: mysql+aiomysql → postgresql+asyncpg

[alembic]
# Path to migration scripts
script_location = core/db/migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration file timestamps
timezone = UTC

# Max length of migration slug
truncate_slug_length = 40

# SQLAlchemy URL — points at PostgreSQL 16 directly (not PgBouncer)
# for Alembic schema introspection. PgBouncer transaction mode does not
# support the DDL transactions that Alembic requires.
# Override at runtime: alembic -x "db=postgresql+asyncpg://..."  or via env.
#
# For local dev: postgresql+asyncpg://praesidium_db:password@localhost:5432/praesidium_hjmm-prod
# For CI: set DATABASE_URL_SYNC env variable (see env.py)
sqlalchemy.url = postgresql+asyncpg://praesidium_db:5i+fliXRzT4KXElzCsNSjrdLmvVG5A594g4z/yicY5Nri7zYZSL9WiirKV7o@10.10.60.11:5432/praesidium_hjmm

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
