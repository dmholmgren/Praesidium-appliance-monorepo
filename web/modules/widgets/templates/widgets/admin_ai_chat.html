<!-- Admin AI Chat Widget — reusable via widget_registry -->
<div id="admin-ai-chat" style="width:100%;">
  <div id="aichat-messages" style="
    height:220px; overflow-y:auto; padding:14px;
    font-size:13px; line-height:1.6; color:var(--text);
  ">
    <div style="color:var(--muted); font-size:12px; text-align:center; padding:24px 0;">
      Ask about onboarding, data quality, folder matching, connectors, widgets, or platform configuration.
    </div>
  </div>

  <div style="border-top:1px solid var(--border); padding:10px 12px; display:flex; gap:8px; background:var(--bg);">
    <input id="aichat-input" type="text"
      placeholder="Ask anything about your firm's setup..."
      style="
        flex:1; padding:8px 12px; border:1px solid var(--border); border-radius:6px;
        font-size:13px; font-family:'DM Sans',sans-serif; color:var(--text);
        background:var(--surface); outline:none; transition:border-color 150ms;
      "
      onfocus="this.style.borderColor='var(--accent)'"
      onblur="this.style.borderColor='var(--border)'"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();window._aiChat.send()}"
    />
    <button onclick="window._aiChat.send()" id="aichat-send" style="
      display:inline-flex; align-items:center; gap:6px;
      padding:8px 14px; background:var(--primary); color:#fff; border:none;
      border-radius:6px; font-size:13px; font-weight:500;
      font-family:'DM Sans',sans-serif; cursor:pointer;
    ">Send</button>
  </div>
</div>

<script>
(function(){
  if (window._aiChat) return;

  var messages = [];
  var streaming = false;

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function md(text) {
    var h = esc(text);
    h = h.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
      return '<pre style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:12px;font-family:Courier New,monospace;overflow-x:auto;margin:8px 0;white-space:pre-wrap;word-break:break-all;">' + code.trim() + '</pre>';
    });
    h = h.replace(/`([^`]+)`/g, '<code style="background:var(--bg);padding:1px 5px;border-radius:3px;font-size:12px;font-family:Courier New,monospace;">$1</code>');
    h = h.replace(/((?:\|.*\|\n?)+)/g, function(block) {
      var rows = block.trim().split('\n').filter(function(r){return r.trim();});
      if (rows.length < 2) return block;
      var data = rows.filter(function(r){return !/^\|[\s\-:|]+\|$/.test(r);});
      if (!data.length) return block;
      var t = '<table class="data-table" style="margin:8px 0;font-size:12px;">';
      data.forEach(function(row, i) {
        var cells = row.split('|').filter(function(c){return c.trim()!=='';});
        var tag = i===0?'th':'td';
        t += '<tr>' + cells.map(function(c){return '<'+tag+'>'+c.trim()+'</'+tag+'>';}).join('') + '</tr>';
      });
      return t + '</table>';
    });
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
    h = h.replace(/^### (.+)$/gm, '<div style="font-weight:600;font-size:13px;margin:10px 0 4px;color:var(--primary);">$1</div>');
    h = h.replace(/^## (.+)$/gm, '<div style="font-weight:600;font-size:14px;margin:12px 0 6px;color:var(--primary);">$1</div>');
    h = h.replace(/^# (.+)$/gm, '<div style="font-family:Lora,serif;font-weight:600;font-size:15px;margin:14px 0 6px;color:var(--primary);">$1</div>');
    h = h.replace(/^- (.+)$/gm, '<div style="padding-left:16px;margin:2px 0;">&bull; $1</div>');
    h = h.replace(/^\d+\. (.+)$/gm, function(m, content) {
      return '<div style="padding-left:16px;margin:2px 0;">' + m.match(/^\d+/)[0] + '. ' + content + '</div>';
    });
    h = h.replace(/\n\n/g, '<div style="margin-top:8px;"></div>');
    h = h.replace(/\n/g, '<br>');
    return h;
  }

  function scroll() {
    var c = document.getElementById('aichat-messages');
    if (c) c.scrollTop = c.scrollHeight;
  }

  function appendMsg(role, content) {
    var c = document.getElementById('aichat-messages');
    if (!c) return null;
    if (messages.length <= 1 && c.children.length === 1 && c.children[0].style.textAlign === 'center') {
      c.innerHTML = '';
    }
    var row = document.createElement('div');
    row.style.cssText = 'margin-bottom:14px;display:flex;gap:10px;';

    var av = document.createElement('div');
    av.style.cssText = 'width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;margin-top:1px;letter-spacing:0.02em;';
    if (role === 'user') {
      av.style.background = 'var(--primary)'; av.style.color = '#fff'; av.textContent = 'You';
    } else {
      av.style.background = 'var(--accent)'; av.style.color = '#fff'; av.textContent = 'AI';
    }

    var b = document.createElement('div');
    b.style.cssText = 'flex:1;min-width:0;';
    if (role === 'user') {
      b.style.cssText += 'background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;';
      b.textContent = content;
    } else {
      b.style.cssText += 'font-size:13px;line-height:1.6;padding-top:2px;';
      if (content) b.innerHTML = md(content);
    }

    row.appendChild(av); row.appendChild(b);
    c.appendChild(row); scroll();
    return b;
  }

  window._aiChat = {
    send: async function() {
      if (streaming) return;
      var input = document.getElementById('aichat-input');
      if (!input) return;
      var text = input.value.trim();
      if (!text) return;

      input.value = '';
      messages.push({role:'user', content:text});
      appendMsg('user', text);

      streaming = true;
      var btn = document.getElementById('aichat-send');
      if (btn) btn.disabled = true;

      var bubble = appendMsg('assistant', '');
      var fullText = '';

      try {
        var resp = await fetch('/tenant-admin/ai-chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({messages:messages}),
        });
        var reader = resp.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';

        while (true) {
          var result = await reader.read();
          if (result.done) break;
          buffer += decoder.decode(result.value, {stream:true});
          var lines = buffer.split('\n');
          buffer = lines.pop();

          for (var i=0; i<lines.length; i++) {
            var line = lines[i];
            if (!line.startsWith('data: ')) continue;
            try {
              var evt = JSON.parse(line.slice(6));
              if (evt.type === 'text') {
                fullText += evt.text;
                if (bubble) { bubble.innerHTML = md(fullText); scroll(); }
              } else if (evt.type === 'tool_start') {
                if (bubble) {
                  var tag = document.createElement('div');
                  tag.style.cssText = 'font-size:11px;color:var(--accent);padding:3px 0 6px;display:flex;align-items:center;gap:4px;';
                  tag.className = 'aichat-tool';
                  tag.innerHTML = '<span style="width:10px;height:10px;border:1.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;"></span> ' + esc(evt.tool);
                  bubble.appendChild(tag);
                }
              } else if (evt.type === 'block_stop') {
                if (bubble) {
                  bubble.querySelectorAll('.aichat-tool span').forEach(function(s) {
                    s.style.animation = 'none';
                    s.style.width = '8px'; s.style.height = '8px';
                    s.style.background = 'var(--accent)';
                    s.style.border = 'none';
                  });
                }
              } else if (evt.type === 'error') {
                if (bubble) {
                  bubble.innerHTML += '<div style="color:#991B1B;font-size:12px;margin-top:6px;padding:6px 8px;background:#FEE2E2;border-radius:4px;">' + esc(evt.text) + '</div>';
                }
              }
            } catch(e) {}
          }
        }
        if (fullText) messages.push({role:'assistant', content:fullText});
      } catch(err) {
        if (bubble) {
          bubble.innerHTML = '<div style="color:#991B1B;padding:6px 8px;background:#FEE2E2;border-radius:4px;font-size:12px;">Connection error: ' + esc(err.message) + '</div>';
        }
      }

      streaming = false;
      if (btn) btn.disabled = false;
      if (input) input.focus();
    }
  };
})();
</script>
