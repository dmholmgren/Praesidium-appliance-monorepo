{% extends "billing/layout.html" %}
{% block billing_content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Clients</h1>
  <button onclick="document.getElementById('new-client').classList.remove('hidden')" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm">New Client</button>
</div>
<input type="text" placeholder="Search clients..." hx-get="{{ brand.billing_url }}/api/v1/billing/clients" hx-trigger="keyup changed delay:300ms" hx-target="#client-list" name="search" class="block w-full rounded-md border-gray-300 shadow-sm text-sm mb-4">
<div id="client-list" class="space-y-3">
{% for client in clients %}
<div class="bg-white rounded-lg shadow-sm border p-4">
  <h3 class="font-medium text-gray-900">{{ client.client_name }}</h3>
  <p class="text-sm text-gray-500">{{ client.email or '' }} | {{ client.phone or '' }}</p>
</div>
{% endfor %}
</div>
{% endblock %}
