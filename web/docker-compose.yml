# Praesidium Platform — Docker Compose
# VM: MAIN-PRD-WEB-01 (10.10.60.10)

services:
  web:
    dns:
      - 10.10.10.1
      - 8.8.8.8
    networks:
      praesidium-internal:
        ipv4_address: 172.28.0.5
      praesidium-edge:
        ipv4_address: 172.28.1.3
    build:
      context: .
      dockerfile: Dockerfile
    container_name: praesidium-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - /mnt/clients:/mnt/clients:ro
      - /mnt/docsend:/mnt/docsend:ro
      - /mnt/praesidium:/mnt/praesidium:rw
      - /mnt/ediscovery:/mnt/ediscovery:rw
      - /opt/praesidium-web:/app
    command: ["python", "startup.py"]

  nginx:
    image: nginx:1.25-alpine
    container_name: praesidium-nginx
    restart: unless-stopped
    volumes:
      - ./web/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      - WEB_UPSTREAM=web:8000
    ports:
      - "80:80"
    depends_on:
      - web
  scraper:
    build:
      context: /datapool/opt/praesidium-scraper
      dockerfile: Dockerfile
    container_name: praesidium-scraper
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://praesidium:hS8_3bJg6NImUwFpFVJ4@172.28.0.1:5432/praesidium
      - POLL_INTERVAL=30
      - LOG_LEVEL=INFO
    networks:
      praesidium-internal: {}
    volumes:
      - /datapool/opt/praesidium-scraper:/app
      - /tmp:/tmp/scraper-debug

networks:
  praesidium-internal:
    external: true
  praesidium-edge:
    external: true

