<!-- partials/job_queued.html — HTMX fragment: job enqueued confirmation + confirm button -->
<div class="mt-2 rounded bg-gray-800 border border-gray-700 px-3 py-2.5">
  <div class="flex items-center gap-2 mb-1.5">
    <span class="badge status-warn">queued</span>
    <span class="text-gray-300 text-xs">{{ action }}</span>
  </div>
  {% if job_id %}
  <div class="font-mono text-xs text-gray-500">Job: {{ job_id }}</div>
  <div class="mt-2"
       id="job-badge-{{ job_id }}"
       hx-get="/admin/htmx/job-status/{{ job_id }}"
       hx-trigger="load, every 3s"
       hx-swap="innerHTML">
    <span class="badge status-unk">polling...</span>
  </div>
  {% else %}
  <div class="text-red-400 text-xs mt-1">Failed to enqueue — Redis may be unavailable</div>
  {% endif %}

  {% if confirm_vm and confirm_bank %}
  <div class="mt-3 pt-3 border-t border-gray-700">
    <p class="text-amber-300 text-xs mb-2">
      ⚠ Review then confirm to proceed with rebuild. Container will restart.
    </p>
    <form hx-post="/admin/htmx/bank/confirm"
          hx-target="closest div.rounded"
          hx-swap="outerHTML">
      <input type="hidden" name="vm_name" value="{{ confirm_vm }}">
      <input type="hidden" name="target_bank" value="{{ confirm_bank }}">
      <button type="submit"
              class="px-3 py-1.5 bg-amber-700 hover:bg-amber-600 rounded text-xs text-amber-100 font-medium transition-colors"
              onclick="return confirm('CONFIRM bank swap for {{ confirm_vm }}? Container will rebuild and restart.')">
        Confirm Swap →
      </button>
    </form>
  </div>
  {% endif %}
</div>
