{% extends "base_tenant.html" %}
{% block title %}Time Entry — {{ brand.platform_name }}{% endblock %}
{% block content %}
<div class="px-6 py-4 max-w-2xl">
  <div class="flex items-center gap-2 text-sm text-gray-400 mb-4">
    <a href="/billing/matters" class="hover:text-gray-600">Matters</a>
    <span>›</span>
    <span class="text-gray-700">New Time Entry</span>
  </div>

  <div class="bg-white border rounded p-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Time Entry</h2>
    <div id="form-error" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 rounded p-3 text-sm"></div>

    <div class="grid grid-cols-2 gap-4 mb-4">
      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Matter *</label>
        <select id="matter_id" class="w-full border rounded px-3 py-2 text-sm" onchange="updateValue()">
          <option value="">Select matter…</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
        <input type="date" id="slip_date" class="w-full border rounded px-3 py-2 text-sm"
               value="{{ now().strftime('%Y-%m-%d') if now else '' }}">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Timekeeper *</label>
        <select id="timekeeper" class="w-full border rounded px-3 py-2 text-sm">
          <option value="">Select…</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Hours *</label>
        <input type="number" id="hours" step="0.25" min="0" max="24"
               class="w-full border rounded px-3 py-2 text-sm"
               placeholder="0.00" oninput="updateValue()">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Rate ($/hr)</label>
        <input type="number" id="rate" step="0.01" min="0"
               class="w-full border rounded px-3 py-2 text-sm"
               placeholder="0.00" oninput="updateValue()">
      </div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Narrative *</label>
      <textarea id="narrative" rows="4" class="w-full border rounded px-3 py-2 text-sm"
                placeholder="Describe the work performed…"></textarea>
    </div>

    <div class="flex items-center justify-between pt-4 border-t">
      <div class="text-lg font-semibold text-gray-900">
        Value: <span id="value-display" class="text-blue-700">$0.00</span>
      </div>
      <div class="flex gap-3">
        <a href="/billing/matters" class="px-4 py-2 border rounded text-sm text-gray-600 hover:bg-gray-50">
          Cancel
        </a>
        <button onclick="saveSlip()"
                class="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">
          Save Entry
        </button>
        <button onclick="saveSlip(true)"
                class="px-4 py-2 bg-green-600 text-white rounded text-sm hover:bg-green-700">
          Save & New
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const PREFILL_MATTER = "{{ prefill_matter }}";

async function loadData() {
  // Load matters
  const mRes  = await fetch('/api/billing/matters?status=active');
  const mData = await mRes.json();
  const sel   = document.getElementById('matter_id');
  mData.matters.forEach(m => {
    const opt = document.createElement('option');
    opt.value       = m.id;
    opt.textContent = m.display_name;
    sel.appendChild(opt);
  });
  if (PREFILL_MATTER) sel.value = PREFILL_MATTER;

  // Load timekeepers
  const tkRes  = await fetch('/api/billing/timekeepers');
  const tkData = await tkRes.json();
  const tkSel  = document.getElementById('timekeeper');
  tkData.timekeepers.forEach(tk => {
    const opt = document.createElement('option');
    opt.value       = tk.ts_tk_id;
    opt.textContent = `${tk.ts_name} (${tk.ts_initials || tk.ts_tk_id})`;
    tkSel.appendChild(opt);
  });

  // Set today's date
  document.getElementById('slip_date').value = new Date().toISOString().split('T')[0];
}

function updateValue() {
  const h = parseFloat(document.getElementById('hours').value || 0);
  const r = parseFloat(document.getElementById('rate').value || 0);
  const v = h * r;
  document.getElementById('value-display').textContent =
    '$' + v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

async function saveSlip(andNew = false) {
  const matter_id  = document.getElementById('matter_id').value;
  const slip_date  = document.getElementById('slip_date').value;
  const timekeeper = document.getElementById('timekeeper').value;
  const hours      = parseFloat(document.getElementById('hours').value || 0);
  const rate       = parseFloat(document.getElementById('rate').value || 0);
  const narrative  = document.getElementById('narrative').value.trim();

  const errEl = document.getElementById('form-error');
  errEl.classList.add('hidden');

  if (!matter_id || !slip_date || !timekeeper || !hours || !narrative) {
    errEl.textContent = 'Please fill in all required fields.';
    errEl.classList.remove('hidden');
    return;
  }

  const res = await fetch('/api/billing/slips', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({matter_id, slip_date, timekeeper, hours, rate, narrative})
  });

  if (res.ok) {
    if (andNew) {
      document.getElementById('hours').value     = '';
      document.getElementById('narrative').value = '';
      document.getElementById('value-display').textContent = '$0.00';
      document.getElementById('slip_date').value = new Date().toISOString().split('T')[0];
    } else {
      const data = await res.json();
      location.href = `/billing/matters/${matter_id}`;
    }
  } else {
    const err = await res.json();
    errEl.textContent = err.detail || 'Error saving slip.';
    errEl.classList.remove('hidden');
  }
}

loadData();
</script>
{% endblock %}
