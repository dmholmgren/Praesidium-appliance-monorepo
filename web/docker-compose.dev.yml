# Praesidium Platform — Development Stack
# VM: MAIN-DEV-WEB-01 (10.10.60.15)
# Mirrors production but uses DEV database (MAIN-DEV-DB-01 at 10.10.60.16)
# No production data. Synthetic/test data only.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: praesidium-dev-web
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/app
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - UVICORN_WORKERS=2
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --reload
      --log-level debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - praesidium-dev-net

  # Dev Redis (local to dev VM — not shared with production)
  redis:
    image: redis:7-alpine
    container_name: praesidium-dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb
    ports:
      - "6379:6379"
    volumes:
      - dev-redis-data:/data
    networks:
      - praesidium-dev-net

  # Dev Meilisearch
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: praesidium-dev-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=dev-master-key-change-me
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - dev-meili-data:/meili_data
    networks:
      - praesidium-dev-net

  # Dev worker (single instance)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: praesidium-dev-worker
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./:/app
    command: >
      python -m rq worker
      --url redis://redis:6379/0
      default billing dms court ediscovery intelligence
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - praesidium-dev-net

volumes:
  dev-redis-data:
  dev-meili-data:

networks:
  praesidium-dev-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.10.0/24
