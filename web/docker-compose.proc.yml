services:

  redis:
    image: redis:7-alpine
    container_name: praesidium-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - praesidium-internal

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: praesidium-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=praesidium-es-01
      - cluster.name=praesidium-cluster
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - bootstrap.memory_lock=true
      - ingest.geoip.downloader.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./:/app
      - /opt/praesidium-mcp/nginx/sites:/opt/praesidium-mcp/nginx/sites:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/praesidium:/mnt/praesidium:rw
      - /mnt/ediscovery:/mnt/ediscovery:rw
      - /mnt/legacy:/mnt/legacy:ro
      - /mnt/legacy/Clients:/mnt/clients:ro
      - /mnt/legacy/Docsend:/mnt/docsend:ro
      - /mnt/legacy-local:/mnt/legacy-local:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default", "billing", "dms", "court", "ediscovery", "intelligence"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - praesidium-internal
    deploy:
      replicas: 8

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: praesidium-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./:/app
    command: ["rqscheduler", "--host", "redis", "--port", "6379", "--interval", "60"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  es-data:

networks:
  praesidium-internal:
    name: praesidium-internal
    external: true
