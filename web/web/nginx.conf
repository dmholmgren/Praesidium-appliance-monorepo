# Praesidium Platform — Nginx Internal Proxy
# No hardcoded domains — uses environment variable substitution.
# This runs inside the nginx container on MAIN-PRD-WEB-01.
# The DMZ reverse proxy (MAIN-DMZ-RPRX-01) handles SSL termination.

upstream app {
    server ${WEB_UPSTREAM};
}

server {
    listen 80 default_server;
    server_name _;

    # Pass all requests to FastAPI — subdomain routing handled by TenantResolver
    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Static files
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Health check passthrough
    location /health {
        proxy_pass http://app/health;
        proxy_set_header Host $host;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
